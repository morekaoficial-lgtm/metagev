version: "3.9"

# Aísla toda la pila (contenedores, red y volúmenes) con el nombre "metagev"
# para no interferir con otros proyectos en el mismo servidor.
name: metagev

services:
  db:
    image: postgres:16-alpine
    container_name: gev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gev_evaluation}
    # Sin puerto publicado en el host: solo la red interna de compose la usa.
    expose:
      - "5432"
    volumes:
      - gev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gev} -d ${POSTGRES_DB:-gev_evaluation}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: gev-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-gev}:${POSTGRES_PASSWORD:-gev_secret}@db:5432/${POSTGRES_DB:-gev_evaluation}
      JWT_SECRET: ${JWT_SECRET:-cambiar_en_produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambiar_en_produccion_refresh}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gev.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@gev.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STORAGE_DIR: /app/storage
      TZ: America/Mexico_City
    volumes:
      - gev_storage:/app/storage
    # Sin puerto publicado en el host: nginx (frontend) lo alcanza por la red interna.
    expose:
      - "3000"

  frontend:
    build: ./frontend
    container_name: gev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${GEV_HTTP_PORT:-80}:80"

volumes:
  gev_pgdata:
  gev_storage:
